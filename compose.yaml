services:
  app:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      DATABASE_PATH: /data/pittan.sqlite
      BACKUP_DIR: /backups
      DEV_AUTH: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - pittan-data:/data
      - pittan-backups:/backups
    stop_grace_period: 15s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
volumes:
  pittan-data:
  pittan-backups:
